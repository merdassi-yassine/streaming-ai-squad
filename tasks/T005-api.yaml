# Phase 3 — couche 5 : présentation (API HTTP). Dépend de T004.
id: T005
title: Couche présentation (API FastAPI)
role: backend_developer
prompt_template: prompts/backend_developer.v2.md
review: true
test_command: [docker, compose, --profile, tests, run, --rm, tests, pytest, -v, -p, no:cacheprovider, tests/]
test_timeout: 1800
write_allow:
  - streaming/
  - tests/
description: |
  Crée `streaming/api.py` : une application FastAPI qui expose la couche métier (services.py) :
  GET /titles/{title_id}, GET /genres/{genre}/titles, GET /trending/{day} (Top 10),
  POST /ratings (corps JSON : user_id, title_id, rating, comment) → 201 ou 404/422,
  GET /users/{user_id}/history, GET /users/{user_id}/recommendations, GET /health (état du cluster :
  nombre de nœuds vus et nombre de nœuds « up »).
  La session Cassandra est créée au démarrage (lifespan) à partir de CASSANDRA_CONTACT_POINTS et du keyspace
  KEYSPACE (variable d'environnement, défaut « streaming »). Les modèles d'entrée/sortie sont des modèles Pydantic.
  Écris `tests/test_api.py` avec `fastapi.testclient.TestClient` sur un keyspace de test dédié.
  Bibliothèques autorisées en plus pour CETTE tâche : fastapi, pydantic, httpx (pour TestClient), uvicorn.
acceptance:
  - api.py n'écrit aucune requête CQL (passe par services.py)
  - POST /ratings renvoie 422 pour une note hors 1..5 et 404 pour un titre inconnu
  - GET /health renvoie le nombre de nœuds up
  - tests via TestClient sur un keyspace dédié, supprimé à la fin
