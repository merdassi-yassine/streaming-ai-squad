# Refonte visuelle du frontend Django — demandée par le Project Owner le 26/11/2026 (« trop basique »).
# Adaptée aux données RÉELLES de T009 (Netflix Top 10 hebdomadaire + Wikidata).
id: T008
title: Frontend v2 (interface type plateforme de streaming)
role: frontend_developer
prompt_template: prompts/frontend_developer.v1.md
review: true
test_command: [docker, compose, --profile, tests, run, --rm, tests, sh, -c, "python -m compileall -q streaming frontend tests && python -c 'import frontend.views' && pytest -v -p no:cacheprovider tests/"]
test_timeout: 1800
write_allow:
  - frontend/
  - tests/
description: |
  Le frontend Django actuel (T006) fonctionne mais il est trop basique. Refais l'interface, SANS changer
  api_client.py ni le comportement testé (codes 404 / 503, messages « Avis enregistré » et
  « Note invalide », jeton CSRF). Lis d'abord frontend/views.py, frontend/settings.py et
  frontend/templates/frontend/title.html, puis écris. Ne lis pas les autres fichiers.
  Nom affiché du site : « CassaStream » (n'utilise aucun nom ni logo de marque existante).

  1. `frontend/static/frontend/style.css` (un seul fichier CSS, pas de CDN ni de JavaScript externe) :
     thème sombre, en-tête fixe, cartes « affiche » au format portrait 2:3 avec dégradé de couleur, rangées
     horizontales défilantes (overflow-x: auto, scroll-snap), effet au survol, grille responsive
     (mobile → 2 colonnes), badges, étoiles. Charge-le dans base.html avec {% load static %}.
  0. DONNÉES RÉELLES : la base contient le Top 10 officiel de Netflix (vues HEBDOMADAIRES enregistrées à la date
     de fin de semaine, un dimanche, ex. 2026-11-22) enrichi par Wikidata. /trending/{day} doit donc être appelé
     avec un dimanche. Ajoute dans views.py `latest_week(today=None) -> str` : dernier dimanche (today compris)
     dont l'écart avec today est d'au moins 2 jours (Netflix publie le mardi), au format AAAA-MM-JJ ;
     ex. jeudi 2026-11-26 → 2026-11-22 ; lundi 2026-11-23 → 2026-11-15. L'accueil utilise ?day= sinon latest_week().
  2. `frontend/templatetags/__init__.py` et `frontend/templatetags/cassastream.py`, filtres :
     `hue` (texte → entier 0..359 stable, via hashlib.md5) pour la couleur de l'affiche ;
     `stars` (note moyenne ou None → chaîne de 5 caractères « ★ » / « ☆ », arrondi à l'entier ; None → « ☆☆☆☆☆ ») ;
     `duree` (secondes → « 1 h 30 min », « 45 min ») ; `millions` (entier → « 27,6 M » au-delà d'un million,
     « 850 k » au-delà de mille, sinon l'entier) ; `local_dt` (chaîne ISO de l'API en UTC, sans fuseau →
     « 26/11/2026 09:42 » à l'heure de settings.TIME_ZONE ; chaîne invalide → renvoyée telle quelle).
  3. settings.py : TIME_ZONE = "Africa/Tunis" ; FEATURED_GENRES = ["science-fiction", "action", "drame",
     "comedie", "animation", "thriller", "fantastique", "horreur"] ; garde tout le reste.
  4. views.py : nouvelle vue `sources` (URL /sources/, ajoute-la dans urls.py — seule modification permise de
     urls.py) : page statique listant les sources — Netflix Top 10 officiel
     (https://www.netflix.com/tudum/top10, fichier all-weeks-global.tsv : vues et heures hebdomadaires mondiales),
     Wikidata (https://query.wikidata.org/sparql, licence CC0 : année, genres, description), et la mention
     « Les avis et notes sont saisis par les utilisateurs de CassaStream ; aucune note n'est importée ».
     Lien « Sources » dans le menu et le pied de page. `home` ajoute `rows` = liste de {"genre": g, "titles": genre_titles(g)} pour chaque genre de
     FEATURED_GENRES (les genres vides sont omis ; une erreur httpx.HTTPStatusError sur un genre l'omet aussi),
     et `hero` = premier élément du Top 10 (ou None). Passe FEATURED_GENRES au contexte (menu des genres).
     Ne modifie pas les autres vues sauf pour passer FEATURED_GENRES au contexte.
  5. Gabarits : base.html (en-tête : logo CassaStream, menu des genres, champ « identifiant spectateur » vers
     l'historique ; pied de page : état du cluster si disponible) ; home.html (bannière « N° 1 aujourd'hui »
     avec titre, genres, résumé, bouton « Voir la fiche » ; rangée « Top 10 Netflix — semaine du … » avec le rang en
     grand chiffre à côté de chaque affiche et les vues avec le filtre millions ; puis une rangée par genre) ; genre.html (grille
     d'affiches) ; title.html (grande bannière dégradée, badges film/série et année, genres, étoiles + note
     sur 5 + nombre d'avis, vues, résumé, épisodes si présent ; formulaire d'avis avec note 1..5 en boutons
     radio et commentaire) ; history.html (tableau : titre lié à sa fiche, date avec local_dt, durée avec duree,
     badge « Terminé » / « En cours ») ; error.html dans le même style. Texte en français, accessible
     (label pour chaque champ, attribut alt/aria-label si besoin).
  6. tests/test_frontend.py : garde TOUS les tests existants (adapte seulement les données factices si une vue
     utilise de nouvelles fonctions : monkeypatch genre_titles sur l'accueil) et ajoute des tests des 4 filtres
     (hue stable et dans 0..359, stars(4.4) == "★★★★☆", stars(None), duree(5400) == "1 h 30 min",
     duree(2700) == "45 min", local_dt("2026-11-26T07:42:58.245000") == "26/11/2026 08:42") et un test que
     l'accueil affiche une rangée de genre.
  Bibliothèques autorisées : django, httpx, pytest, bibliothèque standard (hashlib, zoneinfo, datetime).
acceptance:
  - api_client.py inchangé ; urls.py seulement complété par /sources/ ; tous les anciens tests gardés et verts
  - latest_week testé (jeudi 2026-11-26 → 2026-11-22 ; lundi 2026-11-23 → 2026-11-15) ; filtre millions testé
  - page /sources/ citant Netflix Top 10 et Wikidata (CC0)
  - un fichier CSS local, aucune ressource externe (pas de CDN, pas d'image distante)
  - 5 filtres de gabarit testés (hue, stars, duree, local_dt, millions)
  - accueil : bannière N° 1, rangée Top 10, rangées par genre
  - heure affichée en Africa/Tunis
