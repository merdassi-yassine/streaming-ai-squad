# Phase 3 — couche 3 : tests de la DAO sur le vrai cluster 3 nœuds.
id: T003
title: Tests de la couche DAO
role: backend_developer
prompt_template: prompts/backend_developer.v2.md
review: true
test_command: [docker, compose, --profile, tests, run, --rm, tests, sh, -c, "python -m compileall -q streaming tests && pytest -v -p no:cacheprovider tests/"]
test_timeout: 1800
write_allow:
  - tests/
description: |
  Écris `tests/test_dao.py` qui teste chaque classe de `streaming/dao/` sur le vrai cluster
  (fixtures `cluster`/`session` de tests/conftest.py). Utilise un keyspace de test dédié
  (ex. `streaming_test_dao`) créé avec `create_schema(session, keyspace, replication_factor=3)`
  dans une fixture de module, puis supprimé avec `drop_schema` à la fin.
  Cas à couvrir : aller-retour save/get d'un titre et d'un utilisateur ; list_by_genre trié du plus récent ;
  ajout d'avis visible côté titre ET côté utilisateur, triés du plus récent ; note invalide → ValueError
  sans écriture ; compteurs de vues et de notes ; views_of_day ; history trié et limité.
  Ajoute un test de cohérence : écriture puis lecture en ConsistencyLevel.QUORUM.
acceptance:
  - au moins 10 tests, indépendants les uns des autres (identifiants uniques par test, ex. uuid4)
  - le keyspace « streaming » n'est jamais utilisé ; le keyspace de test est supprimé à la fin
  - aucun test ne dépend de l'ordre d'exécution
